# cargo-deny config. Run locally with `cargo deny check`.
# CI runs the same via the EmbarkStudios/cargo-deny-action job.

[graph]
# All targets we ship to. Limits the dep graph cargo-deny analyses.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
# RustSec advisory database checks. Vulnerabilities deny by default;
# unmaintained crates surface as warnings (not all unmaintained crates
# have a viable replacement).
version = 2
yanked = "warn"
unmaintained = "workspace"
ignore = [
    # Format: { id = "RUSTSEC-YYYY-NNNN", reason = "why we accept this" }
    # quick-xml 0.39/0.40 XML-parsing DoS (quadratic dup-attr check +
    # unbounded namespace-decl allocation), fixed in quick-xml >= 0.41.
    # Reached only transitively via object_store's S3 XML responses, so it's
    # exposed ONLY when the S3 media backend is configured AND the S3 endpoint
    # returns crafted XML. object_store 0.14 (latest) still pins quick-xml
    # ^0.40, so no dep bump reaches 0.41 yet. Re-check and drop these when
    # object_store ships a quick-xml >= 0.41 release.
    { id = "RUSTSEC-2026-0194", reason = "transitive quick-xml DoS; S3-backend-only; no object_store release uses quick-xml >=0.41 yet" },
    { id = "RUSTSEC-2026-0195", reason = "transitive quick-xml DoS; S3-backend-only; no object_store release uses quick-xml >=0.41 yet" },
    # wasmtime "Stores can mix up type indices between engines": requires a
    # Store used across MULTIPLE Engines. vela-extensions builds ONE shared
    # Engine (Plugin::new_engine — "one engine backs every plugin") and every
    # Store is created from it; a SIGHUP reload's fresh runtime keeps its
    # stores within its own engine too, so the mix-up is unreachable. The
    # 45.x line has no patched release — drop this when bumping wasmtime to
    # >=46.0.2 / >=47.0.3 (a major bump: own PR, API + MSRV review).
    { id = "RUSTSEC-2026-0222", reason = "requires cross-engine Store use; vela has a single shared Engine; no 45.x patch exists — revisit on the wasmtime major bump" },
]

[licenses]
# Apache-2.0 compatible permissive set. Add deps to `exceptions` if a
# legitimately-needed crate ships under something not on this list.
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    # webpki-roots ships under CDLA-Permissive-2.0 (license over the
    # Mozilla CA bundle). It's an OSI-uncategorised but permissive
    # license; standard in the rustls dep tree.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
exceptions = []

[bans]
# Default to warning on duplicate versions — modern Rust trees almost
# always have a few, and chasing them produces churn without clear
# value. Promote individual offenders to `deny` if a duplicate is
# actually causing a problem (binary bloat, divergent behavior).
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal deps use `path = "..."` without an explicit
# version, which cargo-deny otherwise flags as a wildcard.
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
# Only crates.io. No git deps in production.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
