[package]
name = "vela-api"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Vela's HTTP API surface: client-server, server-server, application service routes and middleware."

[features]
# Distributed tracing context propagation across federation. Off by
# default. When enabled, signed_request injects a W3C `traceparent`
# header from the current tracing span, and the federation_auth
# middleware extracts it and binds the request span as a child of the
# remote-originated trace. Requires the binary to also enable the
# matching `otel` feature on vela-server so the global propagator and
# tracer provider are installed.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

# Re-export `crate::test_helpers::build_test_state*` to out-of-crate
# consumers (currently `tools/testing/smoketest-rs`). Pulls `tempfile`
# into the regular dependency graph since the helper returns a TempDir
# the caller owns. Off by default — no production binary enables this.
test-harness = ["dep:tempfile"]

# Sandboxed WASM extension runtime. Off by default: vela-extensions is always
# linked (for its types + the no-op Runtime), but the heavy wasmtime backend is
# only pulled in when this feature is on. vela-server enables it by default.
extensions = ["vela-extensions/wasmtime-runtime"]

[dependencies]
vela-core = { workspace = true }
vela-store = { workspace = true }
vela-extensions = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `metrics` is the facade (zero-cost when no recorder is installed).
# Choice of exporter lives in the binary crate — vela-api stays
# backend-agnostic.
metrics = { workspace = true }
dashmap = { workspace = true }
arc-swap = { workspace = true }
rocksdb = { workspace = true }
argon2 = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
hmac = { workspace = true }
ed25519-dalek = { workspace = true }
jsonwebtoken = { workspace = true }
uuid = { workspace = true }
tokio-util = { workspace = true }
image = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
serde_yaml = { workspace = true }
hickory-resolver = { workspace = true }
futures = { workspace = true }
form_urlencoded = "1"
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
# Pulled in only when `test-harness` is on. In-crate tests rely on the
# dev-dependency entry below, which is always available under `cargo test`.
tempfile = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
serde_urlencoded = "0.7"
# Integration tests need ServerSigningKey + canonical JSON for signing
# federation requests from stub remote servers.
base64 = { workspace = true }
# Mock OTLP gRPC collector for the `otel`-gated otlp_export integration
# test (tests/otlp_export.rs). opentelemetry-proto provides the generated
# TraceService server stub; tonic/prost host it.
tonic = "0.14"
prost = "0.14"
opentelemetry-proto = { version = "0.32", features = ["gen-tonic", "trace"] }

[lints]
workspace = true
