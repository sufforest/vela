[workspace]
resolver = "2"
members = ["vela-server", "vela-core", "vela-store", "vela-api", "vela-extensions", "tools/vela-admin"]
# `tools/testing/smoketest-rs` is deliberately NOT a workspace member.
# Its ruma-client dep tree (proc-macros, additional rustls plumbing) is
# heavy enough that gating every `cargo check` of the homeserver on it
# would hurt the dev loop. Run that suite explicitly with
# `cargo test -p vela-smoketest-rs --manifest-path tools/testing/smoketest-rs/Cargo.toml --locked`.
exclude = ["tools/testing/smoketest-rs"]

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "Apache-2.0"
description = "A Matrix homeserver written in Rust."
readme = "README.md"
rust-version = "1.93"

# Workspace-level lint config — every member crate inherits via
# `[lints] workspace = true`. The CI lint job runs with `-D warnings`,
# so the levels here are the project's actual policy. Adjust here, not
# per-file.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Style preferences clippy is wrong about often enough to be net noise:
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "query", "tokio", "tracing", "matched-path"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "catch-panic", "trace", "timeout", "limit"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

# Database
rocksdb = { version = "0.24", default-features = false, features = ["multi-threaded-cf"] }
dashmap = "6"

# Config + CLI
figment = { version = "0.10", features = ["env", "toml"] }
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }

# Distributed tracing (optional, gated by the `otel` feature)
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["tonic", "grpc-tonic"] }
tracing-opentelemetry = "0.33"

# Crypto
argon2 = "0.5"
rand = "0.9"
base64 = "0.22"
sha2 = "0.11"
sha1 = "0.10"
hmac = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
# JWT for matrix-rtc (MSC4143) — LiveKit's JWT auth.
jsonwebtoken = { version = "9", default-features = false }

# Media
uuid = { version = "1", features = ["v4"] }
tokio-util = { version = "0.7", features = ["io"] }
# Image decode/resize for /thumbnail. default-features off to drop
# the avif/exr/farbfeld/qoi/tga/bmp/dds/hdr/ico/openexr/pnm/tiff
# bag we don't need; PNG/JPEG/WebP/GIF cover ~all chat content.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
async-trait = "0.1"
bytes = "1"
# object_store gives us a unified abstraction over S3/GCS/Azure/local
# that handles auth, multipart, retries, virtual-hosting nuances. It's
# the standard cloud-storage abstraction in the Rust ecosystem (used by
# arrow-rs, polars, datafusion).
object_store = { version = "0.13", features = ["aws"] }
futures = "0.3"

# Utilities
thiserror = "2"
anyhow = "1"
tempfile = "3"
regex = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
wiremock = "0.6"
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

# Internal crates. Path-and-version: path wins for local builds, the
# version anchor satisfies cargo-deny + works the day we ever publish.
vela-core = { path = "vela-core", version = "0.2.0" }
vela-store = { path = "vela-store", version = "0.2.0" }
vela-api = { path = "vela-api", version = "0.2.0" }
# default-features off → consumers get the no-op, wasmtime-free Runtime
# unless they opt in via their own `extensions` feature.
vela-extensions = { path = "vela-extensions", version = "0.2.0", default-features = false }

# Dev-profile override: line-table-only debuginfo. Backtraces still
# show file:line (good enough for nearly all triage); variable
# inspection in a debugger does not work. Trade-off: ~30-50% smaller
# `target/` per workspace + per-agent-worktree, ~5-10% faster compile.
# Flip to `debug = 2` (full DWARF) locally if you need rust-gdb /
# rust-lldb value-level inspection.
[profile.dev]
debug = 1
