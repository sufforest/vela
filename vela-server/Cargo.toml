[package]
name = "vela-server"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Vela the Matrix homeserver binary: top-level orchestration, config, signing key, scheduled tasks."

[[bin]]
name = "vela"
path = "src/main.rs"

[[bin]]
name = "vela-backup"
path = "src/bin/backup.rs"

[features]
# Prometheus text-format exporter for /_vela/metrics. Default on — most
# deployments will want it. Turn off (`--no-default-features`) to drop
# the dependency when using an alternate observability stack; the
# endpoint stays wired but returns 503 until a renderer is plumbed.
default = ["prometheus"]
prometheus = ["dep:metrics-exporter-prometheus"]
# Sandboxed WASM extension runtime. Opt-in (the release Docker images build with
# `--features extensions`) so a plain `cargo build` and the `cargo test
# --workspace` CI job stay wasmtime-free — otherwise every vela-api test binary
# would statically link wasmtime. With it off, vela-api's no-op Runtime takes
# over and allows everything.
extensions = ["vela-api/extensions"]
# OpenTelemetry distributed tracing exporter. Off by default — only
# install the OTLP/tonic dependency tree when an operator opts in.
# When enabled, set [tracing.otlp_endpoint] in vela.toml to point at a
# collector (e.g. http://localhost:4317). Spans from the regular
# `tracing` macros bridge into OTLP automatically.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
    "vela-api/otel",
]

[dependencies]
vela-core = { workspace = true }
# Direct dep so main.rs can build PluginConfig/Runtime from the [extensions]
# config. The wasmtime backend is pulled in via the `extensions` feature
# (→ vela-api/extensions → vela-extensions/wasmtime-runtime), unified across
# the graph; default-features stay off here.
vela-extensions = { workspace = true }
vela-store = { workspace = true }
vela-api = { workspace = true }
tokio = { workspace = true }
figment = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dashmap = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true }
rustls = { workspace = true }
reqwest = { workspace = true }
object_store = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
metrics-exporter-prometheus = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[lints]
workspace = true
