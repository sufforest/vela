[package]
name = "vela-store"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Vela's RocksDB-backed storage layer."

[dependencies]
vela-core = { workspace = true }
rocksdb = { workspace = true }
dashmap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
object_store = { workspace = true }
tokio-util = { workspace = true }
uuid = { workspace = true }
jieba-rs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# Opt-in CI test that exercises the S3 MediaStore against a real
# MinIO container. Off by default — the default test loop stays
# RocksDB-only and stays fast. Enable in CI via
# `cargo test -p vela-store --features s3-integration`.
s3-integration = []

[lints]
workspace = true
