# OpenSSL config template for Vela Complement TLS cert generation.
# The entrypoint substitutes __SERVER_NAME__ before invoking openssl.

[req]
default_bits = 2048
prompt = no
default_md = sha256
req_extensions = SAN
distinguished_name = req_distinguished_name

[req_distinguished_name]
CN = __SERVER_NAME__

[SAN]
subjectAltName = DNS:__SERVER_NAME__, DNS:localhost, IP:127.0.0.1
basicConstraints = CA:FALSE
keyUsage = digitalSignature, keyEncipherment
extendedKeyUsage = serverAuth
