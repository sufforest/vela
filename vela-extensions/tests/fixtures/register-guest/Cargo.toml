# Test-only guest plugin exercising the `check_registration` point. Built via
# `tests/fixtures/build.sh`; the artifact is committed as `register_guest.wasm`.
[package]
name = "register-guest"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.58"

[profile.release]
opt-level = "s"
strip = true
lto = true
panic = "abort"

[workspace]
