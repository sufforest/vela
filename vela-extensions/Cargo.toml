[package]
name = "vela-extensions"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# NO default features on purpose. The crate defaults to its types + the no-op
# Runtime (zero wasmtime/Cranelift). This keeps `cargo build --workspace` lean:
# were `wasmtime-runtime` a default, feature unification would drag wasmtime into
# every vela-api test binary (the member is built with its own defaults), bloating
# the link and occasionally OOMing the linker. The real runtime is opt-in via the
# `extensions` feature on vela-api/vela-server, and the crate's own wasmtime tests
# run under a dedicated `--features wasmtime-runtime` CI step.
default = []
# The sandboxed WASM runtime. With it OFF (the default), the crate still exposes
# its types (Verdict, EventContext, PluginConfig) and a no-op Runtime that returns
# Allow, but pulls ZERO wasmtime/Cranelift crates.
wasmtime-runtime = ["dep:wasmtime"]

[dependencies]
# Host runtime. Optional + trimmed default features: we need the Cranelift
# compiler, the Component Model, and runtime support — not the CLI/debug extras.
wasmtime = { version = "45", optional = true, default-features = false, features = [
    "std",
    "runtime",
    "cranelift",
    "component-model",
] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
wat = "1"
