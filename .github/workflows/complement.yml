name: Complement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  complement:
    name: Complement (matrix-spec compliance)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          path: vela

      # Pinned commit so upstream test churn can't break our CI silently.
      # Bump deliberately when we want newer tests; the skiplist re-eval
      # note in tools/testing/complement/skiplist.txt applies.
      - name: Checkout Complement
        uses: actions/checkout@v6
        with:
          repository: matrix-org/complement
          ref: 6be1478db0be8f39ae5a06e5a148d001ca860db3
          path: complement

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Cache the cargo registry + intermediate Rust build via BuildKit's
      # GHA cache backend. First build is ~10min cold; subsequent builds
      # re-use the registry layer.
      - name: Build vela-complement image
        uses: docker/build-push-action@v7
        with:
          context: vela
          file: vela/complement/Dockerfile
          tags: vela-complement:latest
          load: true
          cache-from: type=gha,scope=complement-image
          cache-to: type=gha,scope=complement-image,mode=max

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: complement/go.sum

      - name: Run Complement
        env:
          COMPLEMENT_DIR: ${{ github.workspace }}/complement
          # 30m matches local default; with caching the suite typically
          # completes in 15-20m on ubuntu-latest.
          TIMEOUT: 30m
          LOG: /tmp/complement-run.log
        run: bash vela/tools/testing/complement/run.sh

      - name: Upload Complement log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complement-log
          path: |
            /tmp/complement-run.log
            /tmp/complement-retry.log
          if-no-files-found: ignore
          retention-days: 14
