name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default-deny token scopes; individual jobs override only what they
# legitimately need (none of the current jobs need write).
permissions:
  contents: read

# Cancel in-flight feature-branch runs when a new push arrives.
# Main-branch runs always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v6

      # `cargo test --workspace --all-targets` links one binary per
      # integration test. With image-decoding deps pulled in for media
      # thumbnails, the working set tips past the ~14 GB free on a
      # stock ubuntu-latest runner. Drop preinstalled toolchains we
      # don't use to free ~20 GB before the build starts.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # librocksdb-sys 0.17 (RocksDB 10) drops the bundled bindings and
      # runs bindgen against the headers at build time, so libclang must
      # be on the host.
      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          # Build artefacts share a key across the whole workspace so
          # incremental rebuilds reuse them.
          shared-key: workspace

      - name: cargo build --workspace
        run: cargo build --workspace --all-targets --locked

      - name: cargo test --workspace
        run: cargo test --workspace --all-targets --locked

  msrv:
    # Verifies the SHIPPED code still compiles under the declared minimum
    # supported Rust version (rust-version in Cargo.toml), which must stay
    # <= the rust:1.96 base both Dockerfiles build on — otherwise a dep
    # bump that raises the floor breaks the image build. Drift here is
    # silent without this job. Uses `cargo build` (not `check`) so codegen
    # errors surface, not just type errors.
    #
    # Deliberately NOT `--all-targets`: that additionally links the ~40
    # integration-test binaries, which (a) are never shipped, so their
    # 1.96 compat is irrelevant, and (b) under that link storm rust-lld
    # crashes intermittently on the runner. Building lib + binaries is
    # what the Docker image actually does, and is the floor that matters.
    name: cargo build (MSRV 1.96)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@1.96

      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-msrv

      - name: cargo build --workspace
        run: cargo build --workspace --locked

  lint:
    name: cargo clippy + rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  docs:
    name: cargo doc
    runs-on: ubuntu-latest
    env:
      # Treat broken intra-doc links as build failures.
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-doc

      - name: cargo doc --workspace --no-deps
        run: cargo doc --workspace --no-deps --locked

  deny:
    # Supply-chain check: RustSec advisories, license compatibility,
    # banned/duplicate crates, registry sources. Config in deny.toml.
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  features:
    name: cargo test --features otel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      # wasm-tools turns the guest core modules into components. Use the
      # prebuilt binary — `cargo install wasm-tools` compiles for minutes.
      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-otel

      # The OTel feature pulls in a separate dependency tree
      # (opentelemetry, tonic). Make sure it builds and tests pass.
      - name: cargo test --features otel
        run: cargo test -p vela-server --features otel --locked
      - name: cargo test --features otel (vela-api OTLP export)
        run: cargo test -p vela-api --features otel --test otlp_export --locked

      # The wasm fixtures + example aren't committed — build them from source
      # (see docs/extension-fixtures-build-design.md). The tests below then run
      # against this fresh build, so a fixture can't drift from its source.
      - name: Build wasm fixtures + example
        run: |
          vela-extensions/tests/fixtures/build.sh
          extensions/build-examples.sh
      # Extensions are opt-in: vela-extensions has NO default features, so the
      # default `cargo test --workspace` builds it (and every vela-api test
      # binary) without wasmtime. Exercise the WASM runtime explicitly here.
      # The vela-extensions suite (sandbox + example + WIT-drift) needs its
      # `wasmtime-runtime` feature; the vela-api gate/soft-fail tests need
      # `extensions` (which enables it transitively). `--lib` keeps the latter
      # to the one lib-test binary.
      - name: cargo test vela-extensions (WASM runtime)
        run: cargo test -p vela-extensions --features wasmtime-runtime --locked
      - name: cargo test --features extensions (WASM gate + federation soft-fail)
        run: cargo test -p vela-api --features extensions --lib --locked

  smoketest:
    # Real-client smoke test (ruma-client) against vela on an ephemeral
    # TCP port. Standalone crate (not in workspace members), so it
    # caches separately and stays out of the default workspace test
    # graph. Catches wire-shape regressions Complement misses.
    name: cargo test smoketest-rs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: smoketest-rs
          workspaces: tools/testing/smoketest-rs

      - name: cargo test smoketest-rs
        run: cargo test --manifest-path tools/testing/smoketest-rs/Cargo.toml --locked

  s3-integration:
    # Run the S3 MediaStore tests against a real MinIO container.
    # Unit tests cover our trait surface; this catches S3 wire-protocol
    # bugs that only surface against a real implementation —
    # multipart-upload boundary semantics, auth/signing edge cases, the
    # abort() path actually firing the right wire op on stream failure.
    #
    # MinIO image is pinned to a specific release tag so MinIO Inc.
    # roadmap changes can't surprise us mid-deploy. License note: the
    # AGPL on MinIO server affects redistribution, not CI sidecars —
    # we run it unmodified in a container, vela never links to it.
    #
    # MinIO is started via an explicit `docker run` rather than GHA's
    # `services:` block because services can't pass the `server /data`
    # argument the minio image needs.
    name: cargo test --features s3-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-s3

      # MinIO withdrew its public container images (Docker Hub and quay) in
      # 2025, so the sidecar is versitygw: a small S3 gateway over a posix
      # directory with the same root-key env contract. Pinned tag, bumped
      # deliberately. The bucket is created with curl's built-in SigV4
      # signing, so no second image is needed for a CLI.
      - name: Start S3 sidecar (versitygw)
        run: |
          docker run -d --name s3 \
            -p 9000:7070 \
            -v s3-data:/data \
            -e ROOT_ACCESS_KEY=vela \
            -e ROOT_SECRET_KEY=vela-test-secret \
            versity/versitygw:v1.0.15 posix /data
          # Any HTTP answer means the gateway is listening (there is no
          # unauthenticated health route; / needs a signature).
          for i in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/)" != "000" ]; then
              echo "s3 sidecar listening after ${i} tries"
              break
            fi
            sleep 2
            if [ "$i" = "30" ]; then
              echo "s3 sidecar did not come up in time"
              docker logs s3
              exit 1
            fi
          done

      - name: Create test bucket
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
            --aws-sigv4 "aws:amz:us-east-1:s3" --user vela:vela-test-secret \
            http://127.0.0.1:9000/vela-test)
          [ "$code" = "200" ] || { echo "create bucket failed: HTTP $code"; exit 1; }

      - name: cargo test --features s3-integration
        env:
          VELA_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          VELA_TEST_S3_ACCESS_KEY: vela
          VELA_TEST_S3_SECRET_KEY: vela-test-secret
          VELA_TEST_S3_BUCKET: vela-test
        run: cargo test -p vela-store --features s3-integration --locked

  extensions:
    # Build + lint the guest-side extension SDK and example plugins. They live in
    # a detached `extensions/` workspace (own lockfile, wasm32 target) so the
    # main workspace never compiles them — this job is what keeps them honest.
    # The host integration test that runs the built example lives in the
    # `features` job, which builds the component from source first (the `.wasm`
    # is not committed — see docs/extension-fixtures-build-design.md).
    name: build extensions (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: extensions

      - name: rustfmt
        run: cargo fmt --all --manifest-path extensions/Cargo.toml -- --check

      - name: clippy
        run: cargo clippy --manifest-path extensions/Cargo.toml --target wasm32-unknown-unknown --all-targets --locked -- -D warnings

      - name: build
        run: cargo build --release --manifest-path extensions/Cargo.toml --target wasm32-unknown-unknown --locked
