name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default-deny token scopes; individual jobs override only what they
# legitimately need (none of the current jobs need write).
permissions:
  contents: read

# Cancel in-flight feature-branch runs when a new push arrives.
# Main-branch runs always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v6

      # `cargo test --workspace --all-targets` links one binary per
      # integration test. With image-decoding deps pulled in for media
      # thumbnails, the working set tips past the ~14 GB free on a
      # stock ubuntu-latest runner. Drop preinstalled toolchains we
      # don't use to free ~20 GB before the build starts.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          # Build artefacts share a key across the whole workspace so
          # incremental rebuilds reuse them.
          shared-key: workspace

      - name: cargo build --workspace
        run: cargo build --workspace --all-targets --locked

      - name: cargo test --workspace
        run: cargo test --workspace --all-targets --locked

  msrv:
    # Verifies the project still compiles under the declared minimum
    # supported Rust version (rust-version in Cargo.toml). Drift here is
    # silent without this job. Uses `cargo build` (not `check`) so codegen
    # errors surface, not just type errors.
    name: cargo build (MSRV 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-msrv

      - name: cargo build --workspace --all-targets
        run: cargo build --workspace --all-targets --locked

  lint:
    name: cargo clippy + rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  docs:
    name: cargo doc
    runs-on: ubuntu-latest
    env:
      # Treat broken intra-doc links as build failures.
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-doc

      - name: cargo doc --workspace --no-deps
        run: cargo doc --workspace --no-deps --locked

  deny:
    # Supply-chain check: RustSec advisories, license compatibility,
    # banned/duplicate crates, registry sources. Config in deny.toml.
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  features:
    name: cargo test --features otel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-otel

      # The OTel feature pulls in a separate dependency tree
      # (opentelemetry, tonic). Make sure it builds and tests pass.
      - name: cargo test --features otel
        run: cargo test -p vela-server --features otel --locked

  smoketest:
    # Real-client smoke test (ruma-client) against vela on an ephemeral
    # TCP port. Standalone crate (not in workspace members), so it
    # caches separately and stays out of the default workspace test
    # graph. Catches wire-shape regressions Complement misses.
    name: cargo test smoketest-rs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: smoketest-rs
          workspaces: tools/testing/smoketest-rs

      - name: cargo test smoketest-rs
        run: cargo test --manifest-path tools/testing/smoketest-rs/Cargo.toml --locked
