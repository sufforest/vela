name: Docker

# Continuous Deployment: build + push the production image to
# GitHub Container Registry on every push to main and on every
# semver tag (vX.Y.Z). PRs do NOT publish — those just need CI.
#
# Image: ghcr.io/sufforest/vela
# Tags emitted:
#   - push to main:  :main, :sha-<short>
#   - tag vX.Y.Z:    :X.Y.Z, :X.Y, :X, :latest

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read
  # Required to push to ghcr.io owned by this repo.
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: build + push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Free runner disk before docker build. The image-decoding deps +
      # rocksdb-rs C++ build push past the runner's free disk;
      # dropping unused preinstalled toolchains gives ~20 GB headroom.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN with packages:write is enough — no PAT needed.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # push to main → :main and :sha-<short>
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            # tag vX.Y.Z → :X.Y.Z + :X.Y + :X + :latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse the buildx cache across runs so dep compiles
          # amortise. First run pays full cost (~5 min); subsequent
          # pushes are minute-ish if only sources changed.
          cache-from: type=gha
          cache-to: type=gha,mode=max
