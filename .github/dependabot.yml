version: 2
updates:
  # Cargo dependencies (workspace + members).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    # Group patch + minor updates so we don't drown in PRs. Major
    # bumps still come as individual PRs because they may need
    # code changes.
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - rust

  # GitHub Actions versions used in workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    ignore:
      # The tag is the Rust version to install (e.g. `@1.93` = Rust 1.93).
      - dependency-name: "dtolnay/rust-toolchain"
